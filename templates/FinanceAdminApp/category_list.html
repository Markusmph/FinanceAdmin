{% extends 'base_single_col.html' %}

{% block title %}
Categories
{% endblock %}

{% block actions %}
<a href="{% url 'add_category' %}" class="btn btn-success">Add category</a>
{% endblock %}

{% block content %}
    {% for category in categories %}
        <a href="{% url 'edit_category' pk=category.pk %}" class="text-decoration-none text-reset">
            <div class="card shadow-sm mb-3">
                <div class="card-body">
                    <h5 class="card-title">{{ category.name }}</h5>
                    <p class="card-text text-muted mb-0">{{ category.description }}</p>
                </div>
            </div>
        </a>
    {% endfor %}
{% endblock %}
